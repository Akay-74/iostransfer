# Build the iOS app without a Mac of our own: unsigned .ipa, signed at sideload time
# (ARCHITECTURE §5). Actions pinned to commit SHAs (THREAT_MODEL N18).
name: ios

on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios/App
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Toolchain
        run: |
          xcodebuild -version
          brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build (unsigned)
        run: |
          if ! xcodebuild -project IOStransfer.xcodeproj -scheme IOStransfer -configuration Release \
              -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build > build.log 2>&1; then
            grep -E "error:" build.log | sort -u | head -100
            exit 1
          fi
          grep -E "warning:" build.log | grep -v "/SourcePackages/" | sort -u | head -50 || true
      - name: Package .ipa
        run: |
          APP=build/Build/Products/Release-iphoneos/IOStransfer.app
          test -x "$APP/IOStransfer" || { echo "no executable in $APP"; exit 1; }
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry IOStransfer.ipa Payload
          ls -lh IOStransfer.ipa
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: IOStransfer-ipa
          path: ios/App/IOStransfer.ipa
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: build-log
          path: ios/App/build.log
