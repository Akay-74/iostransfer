# Temporary: reproduce the Windows Apple sign-in connection failure with the full error chain.
name: diag
on:
  push:
    branches: ["diag-*"]
permissions:
  contents: read
jobs:
  signin:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pc
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: pc
      - name: Apple sign-in reachable
        run: cargo test --locked -p iostransfer --bin iostransfer -- --ignored apple_signin --nocapture
        env:
          RUST_LOG: debug
