[package]
name = "iostransfer"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
fs4 = "1.1.0"
futures-util = "0.3.34"
gethostname = "1.1.0"
hex = "0.4.3"
if-addrs = "0.15.0"
iost-proto = { version = "0.1.0", path = "../iost-proto" }
iost-receiver = { version = "0.1.0", path = "../iost-receiver" }
mdns-sd = "0.21.5"
qrcode = "0.14.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "signal"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.27.0", features = ["v4"] }

[dev-dependencies]
bytes = "1.12.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio-util = { version = "0.7.19", features = ["codec"] }
