[package]
name = "iostransfer"
version = "0.2.1"
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
fs4 = "1.1.0"
futures-util = "0.3.34"
gethostname = "1.1.0"
hex = "0.4.3"
if-addrs = "0.15.0"
iost-proto = { version = "0.1.0", path = "../iost-proto" }
iost-receiver = { version = "0.1.0", path = "../iost-receiver" }
idevice = { version = "0.1.68", default-features = false, features = ["usbmuxd", "tcp", "ring", "installation_proxy", "amfi", "pair"] }
isideload = { version = "0.4.4", default-features = false, features = ["install", "fs-storage", "tokio-mt"] }
keyring = { version = "3.6.3", features = ["windows-native", "async-secret-service", "async-io", "crypto-rust"] }
mdns-sd = "0.21.5"
qrcode = "0.14.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "http2"] }
rootcause = "0.12.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "signal"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.27.0", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.190"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
base64 = "0.22.1"
bytes = "1.12.1"
tokio-util = { version = "0.7.19", features = ["codec"] }
