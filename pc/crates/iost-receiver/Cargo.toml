[package]
name = "iost-receiver"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
base64 = "0.23.1"
futures-util = { version = "0.3.34", features = ["sink"] }
getrandom = "0.3"
hex = "0.4.3"
iost-proto = { version = "0.1.0", path = "../iost-proto" }
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "logging"] }
tokio-util = { version = "0.7.19", features = ["codec"] }
tracing = "0.1.44"
uuid = { version = "1.27.0", features = ["v4"] }

[dev-dependencies]
bytes = "1.12.1"
hex = "0.4.3"
rcgen = { version = "0.14.10", default-features = false, features = ["ring"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["test-util"] }
tokio-util = { version = "0.7.19", features = ["codec"] }

[target."cfg(unix)".dependencies]
libc = "0.2.190"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }
